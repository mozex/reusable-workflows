name: Matrix Probe

on:
  workflow_dispatch:
    inputs:
      feature_on:
        type: boolean
        default: false

jobs:
  # A: the shape we use today - a job gated by `if:`. Expected: renders as skipped.
  gated_by_if:
    if: ${{ inputs.feature_on }}
    name: gated-by-if
    runs-on: ubuntu-latest
    steps:
      - run: echo hello

  # B: gated by an EMPTY MATRIX. Does it render at all?
  gated_by_empty_matrix:
    name: gated-by-empty-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        on: ${{ inputs.feature_on && fromJson('[1]') || fromJson('[]') }}
    steps:
      - run: echo hello

  # C: a single-entry matrix - does it still render under a "Matrix:" group?
  single_entry_matrix:
    name: single-entry-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJson('[1]') }}
    steps:
      - run: echo hello
