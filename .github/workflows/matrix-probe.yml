name: Matrix Probe

on:
  workflow_dispatch:
    inputs:
      feature_on:
        type: boolean
        default: false

jobs:
  # Empty matrix PLUS an `if:` guard. Does the guard stop the run-level failure
  # while the empty matrix keeps the job out of the graph?
  empty_matrix_with_if:
    if: ${{ inputs.feature_on }}
    name: empty-matrix-with-if
    runs-on: ubuntu-latest
    strategy:
      matrix:
        on: ${{ inputs.feature_on && fromJson('[1]') || fromJson('[]') }}
    steps:
      - run: echo hello

  # Control: a plain job so the run has something that succeeds.
  control:
    name: control
    runs-on: ubuntu-latest
    steps:
      - run: echo hello
